name: Windows Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '26.5.0'
  NPM_VERSION: '11.17.0'
  RUST_VERSION: '1.97.1'

concurrency:
  group: windows-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    if: github.event.deleted != true
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      installer-artifact: ${{ steps.version.outputs.installer-artifact }}
    steps:
      - name: Check out the revision to test
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve the product version and validate release tags
        id: version
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'package.json must contain a stable MAJOR.MINOR.PATCH version.'
          }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw 'The tag must be vMAJOR.MINOR.PATCH and match package.json.'
          }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the checked-out commit.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "installer-artifact=windows-installer-${version}-$env:GITHUB_RUN_ID" >> $env:GITHUB_OUTPUT

      - name: Set up Node and the npm download cache
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Prepare the pinned Rust and npm versions
        id: environment
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install $env:RUST_VERSION --profile minimal --target x86_64-pc-windows-msvc
          "RUSTUP_TOOLCHAIN=${env:RUST_VERSION}-x86_64-pc-windows-msvc" >> $env:GITHUB_ENV
          npm install --global "npm@$env:NPM_VERSION"
          if (!$env:ImageVersion) { throw 'The runner image version is unavailable.' }
          "image-version=$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Restore Rust dependencies for the independent tests
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ steps.environment.outputs.image-version }}
          workspaces: |
            . -> target
            vendor/electrobun-pixi-native-starter/native/frame -> target
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Run checks independent of the SDK
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm run check:preflight

  build:
    needs: preflight
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ needs.preflight.outputs.version }}
      commit: ${{ needs.preflight.outputs.commit }}
      installer-artifact: ${{ needs.preflight.outputs.installer-artifact }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false

      - name: Set up Node and the npm download cache
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Prepare Windows build tools
        id: environment
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force artifacts/ci-logs | Out-Null
          Start-Transcript -Path artifacts/ci-logs/environment.log
          try {
            rustup toolchain install $env:RUST_VERSION --profile minimal --target x86_64-pc-windows-msvc
            "RUSTUP_TOOLCHAIN=${env:RUST_VERSION}-x86_64-pc-windows-msvc" >> $env:GITHUB_ENV
            npm install --global "npm@$env:NPM_VERSION"
            if (!$env:ImageVersion) { throw 'The runner image version is unavailable.' }
            "image-version=$env:ImageVersion" >> $env:GITHUB_OUTPUT
            cmake --version
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (!$vs) { throw 'MSVC C++ tools and Windows SDK are required.' }
            Write-Output "MSVC: $vs"
            Get-PSDrive C, D -ErrorAction SilentlyContinue | Format-Table Name, Used, Free

            $zigZip = Join-Path $env:RUNNER_TEMP 'zig-0.16.0.zip'
            Invoke-WebRequest 'https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip' -OutFile $zigZip
            if ((Get-FileHash $zigZip -Algorithm SHA256).Hash -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') {
              throw 'Zig archive checksum mismatch.'
            }
            $zigDirectory = Join-Path $env:RUNNER_TEMP 'lumeria-zig'
            Expand-Archive -LiteralPath $zigZip -DestinationPath $zigDirectory
            $zig = Join-Path $zigDirectory 'zig-x86_64-windows-0.16.0/zig.exe'
            if ((& $zig version) -ne '0.16.0') { throw 'Unexpected Zig version.' }
            "LUMERIA_ZIG=$zig" >> $env:GITHUB_ENV

            choco install nsis --version=3.11 --yes --no-progress --allow-downgrade --force
            $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
            if ((& $nsis -VERSION) -ne 'v3.11') { throw 'NSIS 3.11 is required.' }
            "LUMERIA_NSIS=$nsis" >> $env:GITHUB_ENV
          } finally { Stop-Transcript }

      - name: Restore Rust dependencies for the application build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ steps.environment.outputs.image-version }}
          workspaces: |
            . -> target
            vendor/electrobun-pixi-native-starter/native/frame -> ../../.hutch/frame-target
          cache-bin: false
          cache-on-failure: true

      - name: Install application dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci

      - name: Restore the verified SDK and selection record
        id: sdk-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            vendor/electrobun-pixi-native-starter/.hutch/devkit-dcomp-2.0.1
            vendor/electrobun-pixi-native-starter/.hutch/native-toolchain.local.json
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-sdk-v2-${{ steps.environment.outputs.image-version }}-${{
              hashFiles(
                '.github/workflows/release.yml',
                'package-lock.json',
                'vendor/electrobun-pixi-native-starter/package.json',
                'vendor/electrobun-pixi-native-starter/native-toolchain.lock.json',
                'vendor/electrobun-pixi-native-starter/patches/**',
                'scripts/rebuildElectrobunDevkit.ps1',
                'vendor/electrobun-pixi-native-starter/tools/prepare-source.mjs',
                'vendor/electrobun-pixi-native-starter/tools/native-toolchain.mjs',
                'vendor/electrobun-pixi-native-starter/tools/electrobun-dcomp-patch.mjs',
                'vendor/electrobun-pixi-native-starter/tools/patch-electrobun.mjs',
                'vendor/electrobun-pixi-native-starter/tools/bun-runtime-pin.mjs'
              )
            }}

      - name: Set up the SDK source build host
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Prepare and verify the SDK
        env:
          SDK_CACHE_HIT: ${{ steps.sdk-cache.outputs.cache-hit }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Start-Transcript -Path artifacts/ci-logs/toolchain.log
          try {
            if ($env:SDK_CACHE_HIT -eq 'true') {
              npm run native:prepare
            } else {
              npm run native:prepare:source
            }
            npm run native:toolchain:check
            $selection = Get-Content 'vendor/electrobun-pixi-native-starter/.hutch/native-toolchain.local.json' -Raw | ConvertFrom-Json
            if (!$selection.localBuild.buildEnvironment) { throw 'The selected SDK has no source build record.' }
            $selection.localBuild.buildEnvironment | ConvertTo-Json -Depth 10 | Set-Content artifacts/ci-logs/sdk-build-environment.json -Encoding utf8
          } finally { Stop-Transcript }

      - name: Save the verified SDK before running application checks
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            vendor/electrobun-pixi-native-starter/.hutch/devkit-dcomp-2.0.1
            vendor/electrobun-pixi-native-starter/.hutch/native-toolchain.local.json
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

      - name: Run SDK-dependent checks and data-service integration tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Start-Transcript -Path artifacts/ci-logs/checks.log
          try {
            npm run check:app
            npm run test:native-data:integration
          } finally { Stop-Transcript }

      - name: Build the Windows bytecode installer
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Start-Transcript -Path artifacts/ci-logs/package.log
          try { npm run native:release:bytecode } finally { Stop-Transcript }

      - name: Verify and collect only this version's release files
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          $staging = 'release/staging/windows-x64/Lumeria'
          $product = Get-Content "$staging/lumeria.json" -Raw | ConvertFrom-Json
          $bytecodeRoot = "$staging/runtime/Resources/app/bun"
          $bytecode = Get-Content "$bytecodeRoot/bytecode-manifest.json" -Raw | ConvertFrom-Json
          if ($product.version -cne $env:RELEASE_VERSION -or $product.format -cne 'bytecode' -or
              $product.diagnostics -cne $false -or $bytecode.bun -cne '1.4.2' -or
              $bytecode.format -cne 'cjs' -or $bytecode.bytecode -cne $true -or
              !(Test-Path -LiteralPath "$bytecodeRoot/index.js.jsc" -PathType Leaf)) {
            throw 'The release must contain a production bytecode build for the bundled Bun 1.4.2.'
          }
          $name = "Lumeria-$env:RELEASE_VERSION-x64-Setup.exe"
          $installer = Join-Path 'artifacts' $name
          $metadata = Get-Content "$installer.json" -Raw | ConvertFrom-Json
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($metadata.version -cne $env:RELEASE_VERSION -or $metadata.file -cne $name -or
              $metadata.platform -ne 'win32' -or $metadata.arch -ne 'x64' -or
              $metadata.size -ne (Get-Item $installer).Length -or $metadata.sha256 -cne $hash -or
              (Get-Content "$installer.sha256" -Raw).Trim() -cne "$hash  $name") {
            throw 'Installer metadata or checksum does not match the tagged release.'
          }
          New-Item -ItemType Directory -Force artifacts/release-upload | Out-Null
          Copy-Item -LiteralPath $installer, "$installer.sha256" -Destination artifacts/release-upload

      - name: Upload the verified installer
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.preflight.outputs.installer-artifact }}
          path: artifacts/release-upload/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

      - name: Retain build records in Actions only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci-logs/
            artifacts/Lumeria-${{ needs.preflight.outputs.version }}-x64-Setup.exe.json
            release/staging/windows-x64/Lumeria/lumeria.json
            release/staging/windows-x64/Lumeria/runtime/Resources/app/bun/bytecode-manifest.json
            vendor/electrobun-pixi-native-starter/.hutch/native-toolchain.local.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  draft:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download this run's verified installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.installer-artifact }}
          path: release-files

      - name: Create or update an unpublished release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_TAG" == "v$RELEASE_VERSION" ]]
          installer="Lumeria-${RELEASE_VERSION}-x64-Setup.exe"
          cd release-files
          [[ -f "$installer" && -f "$installer.sha256" ]]
          [[ $(find . -mindepth 1 -maxdepth 1 | wc -l) -eq 2 ]]
          actual=$(sha256sum "$installer" | cut -d ' ' -f 1)
          [[ "$(cat "$installer.sha256")" == "$actual  $installer" ]]

          # Resolve annotated and lightweight tags through the commits endpoint.
          remote_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
          [[ "$remote_commit" == "$RELEASE_COMMIT" ]] || { echo 'Tag moved after the build.' >&2; exit 1; }

          # List with authentication so existing drafts are visible; API errors fail
          # instead of being mistaken for a missing release.
          gh api "repos/$GH_REPO/releases?per_page=100" --paginate --slurp > ../releases.json
          jq --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]' ../releases.json > ../matching.json
          count=$(jq 'length' ../matching.json)
          if [[ "$count" -eq 0 ]]; then
            printf 'Windows 11 x64 installer.\n\nBuilt from `%s`.\n\nThe installer is unsigned. Review this exact installer on Windows before publishing.\n' "$RELEASE_COMMIT" > ../release-notes.md
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Lumeria $RELEASE_VERSION" --notes-file ../release-notes.md
          else
            [[ "$count" -eq 1 ]]
            jq -e '.[0].draft == true' ../matching.json > /dev/null || { echo 'Refusing to modify a published release.' >&2; exit 1; }
            jq -e --arg exe "$installer" 'all(.[0].assets[]; .name == $exe or .name == ($exe + ".sha256"))' ../matching.json > /dev/null || { echo 'Draft has unexpected assets; review it manually.' >&2; exit 1; }
          fi
          # Reruns may replace these two assets only while the release is a draft.
          gh release upload "$RELEASE_TAG" "$installer" "$installer.sha256" --clobber
          gh release view "$RELEASE_TAG" --json isDraft,assets | jq -e --arg exe "$installer" '.isDraft and ([.assets[].name] | sort) == ([$exe, ($exe + ".sha256")] | sort)' > /dev/null
          printf '### Release draft ready\n\nTag: `%s`\n\nCommit: `%s`\n\nOnly the installer and SHA-256 file were attached. Publishing remains manual.\n' "$RELEASE_TAG" "$RELEASE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
