[workspace]
resolver = "2"
members = [
  "crates/lumeria-core",
  "crates/lumeria-hot-corners",
  "crates/lumeria-live-desktop",
  "crates/lumeria-native-data",
]
default-members = [
  "crates/lumeria-core",
  "crates/lumeria-hot-corners",
  "crates/lumeria-native-data",
]

[workspace.package]
version = "1.0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
