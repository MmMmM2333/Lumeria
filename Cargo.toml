[workspace]
resolver = "2"
members = [
  "crates/lumeria-core",
  "crates/lumeria-live-desktop",
  "crates/lumeria-native-data",
  "src-tauri",
]
default-members = [
  "crates/lumeria-core",
  "crates/lumeria-native-data",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
